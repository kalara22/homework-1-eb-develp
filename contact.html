<!DOCTYPE html>
<html lang="en">
     <head>
        <title>Contact Me</title>
         <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="contact-banner">
            <div class="contact-logo">Contact Me</div>
        <nav class="contact-list">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">projects</a></li>
            </ul>
        </nav>
        </header>
        
        <nav class="info-list">
            <fieldset>
                <legend>Contact Information</legend>
                <h1>Contact Me</h1>
                <h2>Phone: 510-372-5218</h2>
                <h3>Email: ksandoval@my.campus.edu</h3>
            </fieldset>
        </nav>

        <fieldset>
            <legend>Contact Form</legend>
        <form novalidate>
        <nav class="contact-form">
            <label for="name-id-input">Name:</label>
            <input id="name-id-input" type="text" name="name" placeholder="Enter your name" required></input>
            <span id="name-error" class="error-message"></span>

            <label for="email-id-input">Email:</label>
            <input id="email-id-input" type="email" name="email" placeholder="Enter your email" required></input>
            <span id="email-error" class="error-message"></span>

            <label for="phone-id-input">Phone:</label>
            <input id="phone-id-input" type="tel" name="phone" placeholder="Enter your phone number" required></input>
            <span id="phone-error" class="error-message"></span>

            <button id="phone-number-button" type="submit">add phone number</button>
            <ul id="phone-number-list">
                <li>phone number list</li>
            </ul>
            <label for="message-id-input">Message:</label>
            <textarea id="message-id-input" name="message" placeholder="Enter your message here" required></textarea>
            <span id="message-error" class="error-message"></span>
        <button id="submit-button" type="submit">Submit</button>
        <p id="message-submitted"></p>
        </nav>
        </form>
        </fieldset>
         <script src="script.js"></script>
    </body>
</html>
